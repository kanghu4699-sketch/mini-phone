<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小手机</title>
<style>
  /* ============ 基础重置 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* ============ 手机外框（桌面端显示为手机，移动端全屏） ============ */
  #phone {
    width: 100%; height: 100dvh;
    background: #ededed;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  @media (min-width: 480px) {
    body { padding: 24px; }
    #phone {
      width: 390px; height: min(844px, calc(100dvh - 48px));
      border-radius: 44px; border: 10px solid #1a1a1a;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
  }

  /* ============ 状态栏 ============ */
  #statusbar {
    height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px 0 26px;
    background: #f7f7f7; font-size: 13px; font-weight: 600; color: #111;
  }
  #statusbar .icons { display: flex; align-items: center; gap: 5px; }
  #statusbar svg { display: block; }

  /* ============ 顶部导航栏 ============ */
  #navbar {
    height: 48px; flex-shrink: 0;
    display: flex; align-items: center;
    background: #f7f7f7; border-bottom: 1px solid #e0e0e0;
    padding: 0 12px; gap: 10px;
  }
  #navbar .back { color: #111; font-size: 22px; padding: 0 4px; line-height: 1; }
  #char-avatar {
    width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0;
    background: #c8d6e5; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; color: #fff; overflow: hidden;
  }
  #char-name { font-size: 16px; font-weight: 500; color: #111; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #btn-settings {
    border: none; background: none; padding: 6px; cursor: pointer; color: #555;
    display: flex; align-items: center;
  }

  /* ============ 聊天区 ============ */
  #chat {
    flex: 1; overflow-y: auto; padding: 14px 12px;
    display: flex; flex-direction: column; gap: 14px;
    background: #ededed;
    -webkit-overflow-scrolling: touch;
  }
  .msg { display: flex; gap: 8px; max-width: 100%; }
  .msg .avatar {
    width: 38px; height: 38px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #fff;
  }
  .msg.them .avatar { background: #c8d6e5; }
  .msg.me .avatar { background: #07c160; }
  .bubble-wrap { display: flex; flex-direction: column; max-width: 68%; }
  .bubble {
    padding: 9px 12px; border-radius: 8px;
    font-size: 15px; line-height: 1.5; color: #111;
    word-break: break-word; white-space: pre-wrap;
    position: relative;
  }
  .msg.them .bubble { background: #fff; }
  .msg.me { flex-direction: row-reverse; }
  .msg.me .bubble { background: #95ec69; }
  .msg.them .bubble::before {
    content: ""; position: absolute; left: -5px; top: 12px;
    border: 5px solid transparent; border-right-color: #fff; border-left: 0;
  }
  .msg.me .bubble::before {
    content: ""; position: absolute; right: -5px; top: 12px;
    border: 5px solid transparent; border-left-color: #95ec69; border-right: 0;
  }
  .msg-time { font-size: 11px; color: #999; text-align: center; margin: 2px 0; }

  /* 系统提示（错误/引导） */
  .sys-tip {
    text-align: center; font-size: 12px; color: #999;
    background: rgba(0,0,0,.05); border-radius: 6px;
    padding: 6px 10px; align-self: center; max-width: 85%;
  }
  .sys-tip.error { color: #d03050; background: rgba(208,48,80,.08); }

  /* 打字中指示器 */
  #typing .bubble { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  #typing .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #bbb;
    animation: blink 1.2s infinite;
  }
  #typing .dot:nth-child(2) { animation-delay: .2s; }
  #typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

  /* ============ 底部输入区 ============ */
  #inputbar {
    flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: #f7f7f7; border-top: 1px solid #e0e0e0;
  }
  #input {
    flex: 1; border: none; outline: none; resize: none;
    background: #fff; border-radius: 8px;
    padding: 9px 12px; font-size: 15px; line-height: 1.4;
    max-height: 110px; font-family: inherit;
  }
  #btn-send {
    border: none; cursor: pointer; flex-shrink: 0;
    background: #07c160; color: #fff;
    font-size: 14px; padding: 9px 14px; border-radius: 8px;
  }
  #btn-send:disabled { background: #b8e6c8; cursor: not-allowed; }

  /* ============ 设置抽屉 ============ */
  #drawer-mask {
    position: absolute; inset: 0; background: rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10;
  }
  #drawer-mask.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 11;
    width: 86%; max-width: 340px;
    background: #fff; transform: translateX(100%);
    transition: transform .25s; display: flex; flex-direction: column;
    border-radius: 20px 0 0 20px; overflow: hidden;
  }
  #drawer.open { transform: translateX(0); }
  #drawer header {
    padding: 16px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 16px; font-weight: 600;
  }
  #drawer header button { border: none; background: none; font-size: 20px; cursor: pointer; color: #888; }
  #drawer .body { flex: 1; overflow-y: auto; padding: 16px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; border: 1px solid #ddd; border-radius: 8px;
    padding: 9px 10px; font-size: 14px; font-family: inherit;
    outline: none; background: #fafafa;
  }
  .field input:focus, .field textarea:focus { border-color: #07c160; background: #fff; }
  .field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
  .field .hint { font-size: 11px; color: #aaa; margin-top: 4px; line-height: 1.5; }
  #btn-save {
    width: 100%; border: none; cursor: pointer;
    background: #07c160; color: #fff; font-size: 15px;
    padding: 11px; border-radius: 8px;
  }
  #btn-clear {
    width: 100%; border: none; cursor: pointer; margin-top: 10px;
    background: #fff; color: #d03050; font-size: 14px;
    padding: 10px; border-radius: 8px; border: 1px solid #f0c0cc;
  }
  #save-tip { text-align: center; font-size: 12px; color: #07c160; height: 18px; margin-top: 8px; }
</style>
</head>
<body>

<div id="phone">
  <!-- 状态栏 -->
  <div id="statusbar">
    <span id="clock">9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#111"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#111"><path d="M7.5 9.6 5.8 7.9a2.7 2.7 0 0 1 3.4 0zM11 6.2l-1.4-1.4a4.9 4.9 0 0 0-4.2 0L4 6.2a6.2 6.2 0 0 1 7 0zM13.3 3.9 12 2.6a7.6 7.6 0 0 0-9 0L1.7 3.9a9.3 9.3 0 0 1 11.6 0z"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="19" height="11" rx="3" fill="none" stroke="#111" opacity=".4"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="#111"/><path d="M21.5 4v4a2.2 2.2 0 0 0 0-4z" fill="#111" opacity=".4"/></svg>
    </span>
  </div>

  <!-- 导航栏 -->
  <div id="navbar">
    <span class="back">&#8249;</span>
    <div id="char-avatar">?</div>
    <div id="char-name">未设置角色</div>
    <button id="btn-settings" title="设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- 聊天区 -->
  <div id="chat"></div>

  <!-- 输入区 -->
  <div id="inputbar">
    <textarea id="input" rows="1" placeholder="说点什么..."></textarea>
    <button id="btn-send">发送</button>
  </div>

  <!-- 设置抽屉 -->
  <div id="drawer-mask"></div>
  <div id="drawer">
    <header>设置 <button id="btn-close-drawer">&times;</button></header>
    <div class="body">
      <div class="field">
        <label>角色名称</label>
        <input id="cfg-name" placeholder="例如：林小满">
      </div>
      <div class="field">
        <label>角色人设（System Prompt）</label>
        <textarea id="cfg-persona" placeholder="例如：你是林小满，22岁，傲娇但关心人的青梅竹马，说话简短口语化，不超过50字..."></textarea>
        <div class="hint">这段文字就是 AI 的「人格」。写得越具体，角色越稳。</div>
      </div>
      <div class="field">
        <label>接口地址 Base URL</label>
        <input id="cfg-url" placeholder="https://api.deepseek.com/v1">
        <div class="hint">DeepSeek 填 https://api.deepseek.com/v1 ，其他服务填对应的地址</div>
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="cfg-key" type="password" placeholder="sk-...">
        <div class="hint">只存在你自己的浏览器里，不会上传。别截图发给别人。</div>
      </div>
      <div class="field">
        <label>模型名称</label>
        <input id="cfg-model" placeholder="deepseek-chat">
      </div>
      <button id="btn-save">保存</button>
      <div id="save-tip"></div>
      <button id="btn-clear">清空聊天记录</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================= 配置与状态 ================= */
  var DEFAULTS = {
    charName: "",
    persona: "",
    baseUrl: "https://api.deepseek.com/v1",
    apiKey: "",
    model: "deepseek-chat"
  };
  var LS_CFG = "mini_phone_config";
  var LS_MSG = "mini_phone_messages";
  var MAX_MSGS = 200; // 本地最多保留200条，超出丢弃最旧的

  var config = loadConfig();
  var messages = loadMessages();
  var sending = false;

  function loadConfig() {
    try {
      var raw = localStorage.getItem(LS_CFG);
      return raw ? Object.assign({}, DEFAULTS, JSON.parse(raw)) : Object.assign({}, DEFAULTS);
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function saveConfig() { localStorage.setItem(LS_CFG, JSON.stringify(config)); }
  function loadMessages() {
    try {
      var raw = localStorage.getItem(LS_MSG);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveMessages() {
    if (messages.length > MAX_MSGS) messages = messages.slice(-MAX_MSGS);
    try { localStorage.setItem(LS_MSG, JSON.stringify(messages)); } catch (e) {}
  }

  /* ================= DOM ================= */
  var $ = function (id) { return document.getElementById(id); };
  var chatEl = $("chat"), inputEl = $("input"), sendBtn = $("btn-send");
  var charAvatar = $("char-avatar"), charName = $("char-name");

  /* ================= 时钟 ================= */
  function tick() {
    var d = new Date();
    $("clock").textContent = d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  }
  tick(); setInterval(tick, 10000);

  /* ================= 渲染 ================= */
  function fmtTime(ts) {
    var d = new Date(ts), now = new Date();
    var hm = (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
    var sameDay = d.toDateString() === now.toDateString();
    var yesterday = new Date(now.getTime() - 86400000).toDateString() === d.toDateString();
    if (sameDay) return hm;
    if (yesterday) return "昨天 " + hm;
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
  }

  function refreshHeader() {
    var name = config.charName || "未设置角色";
    charName.textContent = name;
    charAvatar.textContent = config.charName ? config.charName.charAt(0) : "?";
  }

  function renderAll() {
    chatEl.innerHTML = "";
    refreshHeader();
    if (!messages.length) {
      addTip(config.apiKey ? "开始和 " + (config.charName || "TA") + " 聊天吧" : "点右上角齿轮，先填 API Key 和角色人设");
    }
    var lastTime = 0;
    messages.forEach(function (m) {
      if (m.time - lastTime > 300000) { // 间隔超过5分钟显示时间
        var t = document.createElement("div");
        t.className = "msg-time"; t.textContent = fmtTime(m.time);
        chatEl.appendChild(t);
        lastTime = m.time;
      }
      chatEl.appendChild(buildMsg(m));
    });
    scrollBottom();
  }

  function buildMsg(m) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + (m.role === "user" ? "me" : "them");
    var avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = m.role === "user" ? "我" : (config.charName ? config.charName.charAt(0) : "?");
    var bw = document.createElement("div");
    bw.className = "bubble-wrap";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.content;
    bw.appendChild(bubble); wrap.appendChild(avatar); wrap.appendChild(bw);
    return wrap;
  }

  function appendMsg(m) { chatEl.appendChild(buildMsg(m)); scrollBottom(); }
  function addTip(text, isError) {
    var d = document.createElement("div");
    d.className = "sys-tip" + (isError ? " error" : "");
    d.textContent = text;
    chatEl.appendChild(d); scrollBottom();
  }
  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  function showTyping() {
    var d = document.createElement("div");
    d.id = "typing"; d.className = "msg them";
    d.innerHTML = '<div class="avatar">' + escapeHtml(config.charName ? config.charName.charAt(0) : "?") + '</div>' +
      '<div class="bubble-wrap"><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
    chatEl.appendChild(d); scrollBottom();
  }
  function hideTyping() { var t = $("typing"); if (t) t.remove(); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ================= 发送与 API 调用 ================= */
  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    if (sending) return;
    if (!config.apiKey) {
      addTip("还没填 API Key，点右上角齿轮去设置", true);
      openDrawer();
      return;
    }
    if (!config.persona) {
      addTip("建议先填角色人设，不然 TA 没有性格", true);
      openDrawer();
      return;
    }

    var userMsg = { role: "user", content: text, time: Date.now() };
    messages.push(userMsg); saveMessages(); appendMsg(userMsg);
    inputEl.value = ""; autoGrow();
    sending = true; sendBtn.disabled = true;
    showTyping();

    callAI().then(function (reply) {
      hideTyping();
      var aiMsg = { role: "assistant", content: reply, time: Date.now() };
      messages.push(aiMsg); saveMessages(); appendMsg(aiMsg);
    }).catch(function (err) {
      hideTyping();
      addTip("出错了：" + err.message + "（检查网络、Key 或接口地址）", true);
    }).then(function () {
      sending = false; sendBtn.disabled = false; inputEl.focus();
    });
  }

  function callAI() {
    var url = config.baseUrl.replace(/\/+$/, "") + "/chat/completions";
    var history = messages.slice(-20).map(function (m) { // 只带最近20条，控制成本
      return { role: m.role, content: m.content };
    });
    var payload = {
      model: config.model || "deepseek-chat",
      messages: [{ role: "system", content: config.persona }].concat(history),
      temperature: 0.8
    };
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 60000);
    return fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + config.apiKey
      },
      body: JSON.stringify(payload),
      signal: controller.signal
    }).then(function (res) {
      clearTimeout(timer);
      if (!res.ok) {
        return res.text().then(function (t) {
          var msg = "HTTP " + res.status;
          if (res.status === 401) msg = "API Key 无效(401)";
          else if (res.status === 402) msg = "余额不足(402)";
          else if (res.status === 429) msg = "请求太频繁(429)，稍等再试";
          throw new Error(msg + (t && t.length < 200 ? " " + t : ""));
        });
      }
      return res.json();
    }).then(function (data) {
      if (data && data.choices && data.choices[0] && data.choices[0].message) {
        return data.choices[0].message.content;
      }
      throw new Error("接口返回格式异常");
    }).catch(function (e) {
      clearTimeout(timer);
      if (e.name === "AbortError") throw new Error("请求超时(60秒)");
      throw e;
    });
  }

  /* ================= 输入框行为 ================= */
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + "px";
  }
  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);

  /* ================= 设置抽屉 ================= */
  var drawer = $("drawer"), mask = $("drawer-mask");
  function openDrawer() {
    $("cfg-name").value = config.charName;
    $("cfg-persona").value = config.persona;
    $("cfg-url").value = config.baseUrl;
    $("cfg-key").value = config.apiKey;
    $("cfg-model").value = config.model;
    drawer.classList.add("open"); mask.classList.add("open");
  }
  function closeDrawer() { drawer.classList.remove("open"); mask.classList.remove("open"); }
  $("btn-settings").addEventListener("click", openDrawer);
  $("btn-close-drawer").addEventListener("click", closeDrawer);
  mask.addEventListener("click", closeDrawer);

  $("btn-save").addEventListener("click", function () {
    config.charName = $("cfg-name").value.trim();
    config.persona = $("cfg-persona").value.trim();
    config.baseUrl = $("cfg-url").value.trim() || DEFAULTS.baseUrl;
    config.apiKey = $("cfg-key").value.trim();
    config.model = $("cfg-model").value.trim() || DEFAULTS.model;
    saveConfig();
    $("save-tip").textContent = "已保存";
    setTimeout(function () { $("save-tip").textContent = ""; }, 1500);
    renderAll();
    closeDrawer();
  });

  $("btn-clear").addEventListener("click", function () {
    if (!confirm("确定清空全部聊天记录？不可恢复")) return;
    messages = []; saveMessages(); renderAll();
  });

  /* ================= 启动 ================= */
  renderAll();
  if (!config.apiKey) setTimeout(openDrawer, 400);
})();
</script>
</body>
</html>
